[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.22.2"

# Old Wix paths. 301 so search rankings carry over.
[[redirects]]
  from = "/book-online"
  to = "/book"
  status = 301

[[redirects]]
  from = "/music"
  to = "/#music"
  status = 301

[[redirects]]
  from = "/video"
  to = "/#video"
  status = 301

[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/product-page/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
